name: Build

# - Todo push/PR: compila o app e o instalador e guarda como artefato do run.
# - Tag "v*" (ex.: v1.2.0): faz o mesmo e anexa à Release o instalador (MouseModes-Setup.exe) e o SHA-256 dele.
#   A versão da tag precisa bater com o arquivo VERSION, e o CHANGELOG.md e o CHANGELOG.en.md precisam ter a seção
#   dela ("## 1.2.0"): o texto da Release são essas seções, em português e em inglês.
#
# As actions são fixadas pelo commit (com a versão no comentário): uma tag pode ser movida para outro código,
# um commit não. Para atualizar, troque o SHA pelo da versão nova (git ls-remote --tags <repo>).
#
# Assinatura de código (SignPath Foundation, grátis para open source): só roda quando a variável do repositório
# SIGNPATH_ORGANIZATION_ID existe (Settings → Secrets and variables → Actions → Variables), junto com o segredo
# SIGNPATH_API_TOKEN. Sem elas, a Release sai como antes, sem assinatura. Com elas, o job de Release manda o
# instalador para a SignPath, espera a aprovação manual (até 1 h) e publica o instalador assinado.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: App + instalador (.NET Framework 4.8)
    runs-on: ubuntu-24.04
    outputs:
      installer-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Mono e NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-devel nsis
          test -f /usr/lib/mono/4.8-api/mscorlib.dll

      - name: Conferir versão da tag e notas
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d ' \r\n' < VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::A tag ($TAG) não bate com o arquivo VERSION ($FILE)."
            exit 1
          fi
          for NOTES in CHANGELOG.md CHANGELOG.en.md; do
            if ! tr -d '\r' < "$NOTES" | grep -qxF "## $FILE"; then
              echo "::error::O $NOTES não tem a seção \"## $FILE\", que vira o texto da Release."
              exit 1
            fi
          done

      - name: Compilar
        run: ./build.sh

      - name: Guardar artefatos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MouseModes-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error

      # Só o instalador, num artefato próprio: é o que vai para a SignPath assinar (nas tags).
      - name: Guardar o instalador para assinar
        id: unsigned
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MouseModes-Setup-unsigned-${{ github.sha }}
          path: dist/MouseModes-Setup.exe
          if-no-files-found: error

      - name: SHA-256 no resumo do run
        run: |
          echo '### SHA-256' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          (cd dist && sha256sum *.exe) >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  windows-check:
    name: Compilador da Microsoft e testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dotnet build (net48)
        run: dotnet build src/MouseModes.csproj -c Release
      # Os testes só leem o Windows: nada aplica mouse, plano de energia ou USB no runner.
      - name: dotnet test
        run: dotnet test tests/MouseModes.Tests/MouseModes.Tests.csproj -c Release

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read # a SignPath baixa o artefato do instalador com este token
    steps:
      # Só para ler os CHANGELOGs: o instalador vem do artefato do job de build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MouseModes-${{ github.sha }}
          path: dist

      # Assinatura pela SignPath Foundation, quando o projeto estiver aprovado (ver o comentário no topo). A pessoa que
      # aprova recebe o pedido no site da SignPath; o job espera até 1 h.
      - name: Assinar o instalador (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mousemodes
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.installer-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed

      - name: Usar o instalador assinado
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          test -f dist/signed/MouseModes-Setup.exe
          mv -f dist/signed/MouseModes-Setup.exe dist/MouseModes-Setup.exe

      # O SHA-256 é sempre do instalador publicado (assinado ou não): deixa conferir que é o que o CI gerou.
      - name: SHA-256 do instalador
        id: hash
        run: |
          cd dist
          sha256sum MouseModes-Setup.exe > MouseModes-Setup.exe.sha256
          echo "sha256=$(cut -d' ' -f1 MouseModes-Setup.exe.sha256)" >> "$GITHUB_OUTPUT"
          cat MouseModes-Setup.exe.sha256

      # Texto da Release: a seção desta versão no CHANGELOG.md (português) e no CHANGELOG.en.md (inglês),
      # mais o SHA-256 e como conferir.
      - name: Notas da Release
        env:
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          section() { tr -d '\r' < "$1" | awk -v v="$VERSION" '/^## / { if (on) exit; on = ($2 == v); next } on'; }
          section CHANGELOG.md > dist/notes.md
          section CHANGELOG.en.md > dist/notes.en.md
          {
            cat dist/notes.md
            echo
            echo '---'
            echo
            echo '**English**'
            cat dist/notes.en.md
            echo
            echo '---'
            echo
            echo "SHA-256 do instalador / installer SHA-256: \`$SHA256\`"
            echo
            echo 'Para conferir no PowerShell / To check it in PowerShell: `(Get-FileHash .\MouseModes-Setup.exe -Algorithm SHA256).Hash`'
            echo
            echo '[Política de assinatura de código](https://github.com/gabrielolvv/mousemodes#pol%C3%ADtica-de-assinatura-de-c%C3%B3digo) · [Code signing policy](https://github.com/gabrielolvv/mousemodes/blob/main/README.en.md#code-signing-policy)'
          } > dist/release-notes.md
          cat dist/release-notes.md

      # Para a pessoa, um arquivo e um clique: o instalador. O .sha256 vai junto para quem quiser conferir.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: MouseModes ${{ github.ref_name }}
          files: |
            dist/MouseModes-Setup.exe
            dist/MouseModes-Setup.exe.sha256
          fail_on_unmatched_files: true
          body_path: dist/release-notes.md
